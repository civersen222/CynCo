# CynCo CI (GLM review T1, docs/reviews/2026-11-06-glm5-engineering-review-triage.md).
#
# Two jobs, deliberately unequal:
#   guards — the post-change guard lane (`npm run typecheck`, `npm run audit:wiring`).
#            This is the job to make a required check on `main`.
#   suite  — the full engine suite and the TUI suite. Advisory (continue-on-error)
#            until the owner makes it a required check: its Linux failures are
#            classified (docs/NOW.md), and since F208 it takes nothing from the
#            Ubuntu mirror that can turn it red (ripgrep is a pinned release; the
#            polyglot image build is bounded and skips, loudly, on a stalled
#            mirror). Its vitest output is uploaded so a red run can be read
#            without re-running it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guard lane (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `oneShotPreflight.test.ts` spawns `bun engine/main.ts --run-task`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm ci
      - name: strict type-check (F185)
        run: npm run typecheck
      - name: guard lane
        run: npm run audit:wiring

  suite:
    name: full suite (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      # tools/git.test.ts commits in a scratch repo; a runner has no identity.
      GIT_AUTHOR_NAME: cynco-ci
      GIT_AUTHOR_EMAIL: ci@cynco.invalid
      GIT_COMMITTER_NAME: cynco-ci
      GIT_COMMITTER_EMAIL: ci@cynco.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The Grep tool shells out to ripgrep; the runner image does not ship it. It used to come
      # from `apt-get install`, and the runner could not resolve the Ubuntu mirror for hours
      # (2026-11-11, PR #222 onward): the step failed, the engine suite never ran. Now it is
      # ripgrep's own release from GitHub, the version the owner's PC runs, pinned by the
      # SHA-256 GitHub publishes for the asset. A new version means a new hash here.
      - name: install ripgrep (pinned release, checksum-verified)
        env:
          RG_VERSION: '15.1.0'
          RG_SHA256: 1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
        run: |
          set -euo pipefail
          asset="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/rg.tar.gz" "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${asset}.tar.gz"
          echo "${RG_SHA256}  $RUNNER_TEMP/rg.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/rg.tar.gz" -C "$RUNNER_TEMP"
          install -D -m 0755 "$RUNNER_TEMP/${asset}/rg" "$HOME/.local/bin/rg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rg" --version
      - run: npm ci
      # scripts/__tests__ run scripts/cynco-outcome-model.py, which imports numpy and sklearn.
      - run: python -m pip install -q -e "./tui[dev]" numpy scikit-learn
      - name: engine suite (vitest)
        run: npx vitest run 2>&1 | tee vitest-linux.txt; exit "${PIPESTATUS[0]}"
      - name: TUI suite (pytest)
        if: always()
        run: cd tui && python -m pytest tests/ -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-linux
          path: vitest-linux.txt
          retention-days: 14
