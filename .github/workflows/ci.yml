# CynCo CI (GLM review T1, docs/reviews/2026-11-06-glm5-engineering-review-triage.md).
#
# Two jobs, deliberately unequal:
#   guards — the post-change guard lane (`npm run typecheck`, `npm run audit:wiring`).
#            This is the job to make a required check on `main`.
#   suite  — the full engine suite and the TUI suite. Advisory (continue-on-error)
#            until its Linux failures are classified: the Windows baseline on the
#            owner's box has known red files (docs/NOW.md), and this run is the
#            cheapest way to learn which of those are Windows-only. Its vitest
#            output is uploaded so a red run can be read without re-running it.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guard lane (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `oneShotPreflight.test.ts` spawns `bun engine/main.ts --run-task`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm ci
      - name: strict type-check (F185)
        run: npm run typecheck
      - name: guard lane
        run: npm run audit:wiring

  suite:
    name: full suite (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      # tools/git.test.ts commits in a scratch repo; a runner has no identity.
      GIT_AUTHOR_NAME: cynco-ci
      GIT_AUTHOR_EMAIL: ci@cynco.invalid
      GIT_COMMITTER_NAME: cynco-ci
      GIT_COMMITTER_EMAIL: ci@cynco.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The Grep tool shells out to ripgrep; the runner image does not ship it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: npm ci
      # scripts/__tests__ run scripts/cynco-outcome-model.py, which imports numpy and sklearn.
      - run: python -m pip install -q -e "./tui[dev]" numpy scikit-learn
      - name: engine suite (vitest)
        run: npx vitest run 2>&1 | tee vitest-linux.txt; exit "${PIPESTATUS[0]}"
      - name: TUI suite (pytest)
        if: always()
        run: cd tui && python -m pytest tests/ -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-linux
          path: vitest-linux.txt
          retention-days: 14
