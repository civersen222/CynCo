# The profile the engine falls back to when the user has none.
#
# It must name the model the README's Quick Start tells a new user to pull, or
# the engine starts and then asks the provider for a tag that was never fetched.
# Coupled by engine/__tests__/guards/quickStartStartsTheEngine.test.ts.
#
# Ollama-shaped on purpose: config.ts already defaults base_url to
# http://localhost:11434, and the Quick Start is the Ollama path. The llama.cpp
# direct provider is the faster way to run this and the README documents it, but
# it wants a GGUF on disk and its own env, which the Quick Start never sets up.
#
# `provider` is named here rather than left to the built-in default, because the
# built-in default is 'llama-cpp'. The Quick Start sets no environment variables
# at all and launches through the TUI, which forwards none, so without this line
# the documented Ollama path booted the llama.cpp provider and hunted for a model
# file nothing had downloaded. Resolution is env > profile > built-in, so a user
# who sets LOCALCODE_PROVIDER still wins, and a user whose own profile names no
# provider still falls through to 'llama-cpp'.
#
# `qwen3.8:27b`, not `qwen3.6`: in Ollama's library the bare `qwen3.6` tag is
# `qwen3.6:latest`, which is the 35B-A3B MoE (23 GB), not the 27B the README
# describes, and Qwen3.8-27B is the model CynCo is developed and measured on
# (2026-11-13). The size tag is spelled out so the pull cannot drift to another
# size when the library moves `latest`. Temperature 1.0 is the Qwen3.8 model
# card's thinking-mode sampler, the same value the owner's own profiles use.
name: default
provider: ollama
model: qwen3.8:27b
context_length: 65536
temperature: 1.0
