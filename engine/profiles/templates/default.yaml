# The profile the engine falls back to when the user has none.
#
# It must name the model the README's Quick Start tells a new user to pull, or
# the engine starts and then asks the provider for a tag that was never fetched.
# Coupled by engine/__tests__/guards/quickStartStartsTheEngine.test.ts.
#
# Ollama-shaped on purpose: config.ts already defaults base_url to
# http://localhost:11434, and the Quick Start is the Ollama path. The llama.cpp
# direct provider is the faster way to run this and the README documents it, but
# it is opt-in through LOCALCODE_PROVIDER and its own env, so the shipped
# fallback should not presume a GGUF on disk.
name: default
model: qwen3.6
context_length: 65536
temperature: 0.7
