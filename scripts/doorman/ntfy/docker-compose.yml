# ntfy on the doorman (wakefulness slice 6). Host network so it can bind the
# Tailscale address only (server.yml is written by deploy.sh from `tailscale ip -4`);
# the cache lives in a named volume so a container restart keeps undelivered
# messages. No auth file: tailnet membership is the authentication, the same
# posture as the PC server it replaces (docs/liveness-setup.md §1).
services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    command: serve
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: America/Phoenix
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://$(grep -oE '[0-9.]+:8090' /etc/ntfy/server.yml)/v1/health | grep -q '\"healthy\":true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  ntfy-cache:
